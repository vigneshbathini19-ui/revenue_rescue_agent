services:
  - type: web
    name: revenue-rescue-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: FRONTEND_URL
        value: https://revenue-rescue-frontend.onrender.com

  - type: web
    name: revenue-rescue-frontend
    runtime: node
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: revenue-rescue-backend
          type: web
          property: host
